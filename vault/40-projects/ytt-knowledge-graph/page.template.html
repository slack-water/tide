<title>Yoga Lineage Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: full-height graph canvas with a reading panel on the right (stacks below on phones) */
:root {
  --bg: #f3f4f0; --surface: #ffffff; --ink: #1f2430; --muted: #616a78; --line: #d8dbd2;
  --indigo: #2f3f7a; --turmeric: #c98a12; --faint: #b9beb4;
  --f-display: "Spectral", Georgia, serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  --fam-krish: #c98a12; --fam-siva: #c2553a; --fam-kriya: #6d4fa3; --fam-west: #2f8a7a;
  --fam-modern: #2f3f7a; --fam-premodern: #7a6a50; --fam-ext: #8b919a;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13161d; --surface: #1b1f29; --ink: #e6e8ee; --muted: #9aa2b1; --line: #2c3240;
  --indigo: #9fb0ef; --turmeric: #e7ad3c; --faint: #4a5161;
  --fam-krish: #e7ad3c; --fam-siva: #e47b62; --fam-kriya: #ab92e0; --fam-west: #5cc2b0;
  --fam-modern: #8ea2ee; --fam-premodern: #b9a684; --fam-ext: #8b919a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #13161d; --surface: #1b1f29; --ink: #e6e8ee; --muted: #9aa2b1; --line: #2c3240;
  --indigo: #9fb0ef; --turmeric: #e7ad3c; --faint: #4a5161;
  --fam-krish: #e7ad3c; --fam-siva: #e47b62; --fam-kriya: #ab92e0; --fam-west: #5cc2b0;
  --fam-modern: #8ea2ee; --fam-premodern: #b9a684; --fam-ext: #8b919a; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); }
h1 { font: 700 1.35rem/1.1 var(--f-display); margin: 0; letter-spacing: .01em; }
h1 em { font-weight: 500; color: var(--turmeric); }
.views { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.views button { font: 600 .85rem var(--f-body); border: 0; background: none; color: var(--muted); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
.views button[aria-pressed="true"] { background: var(--indigo); color: var(--bg); }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-left: auto; font-size: .85rem; color: var(--muted); }
.tools label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
#q { font: inherit; padding: 5px 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; width: 12rem; max-width: 100%; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--turmeric); outline-offset: 2px; }

main { display: grid; grid-template-columns: 1fr minmax(280px, 360px); min-height: 0; }
.stage { position: relative; min-height: 0; }
#cy { position: absolute; inset: 0; }
.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; background: color-mix(in srgb, var(--surface) 92%, transparent);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .78rem; color: var(--muted); display: grid; gap: 3px; max-width: calc(100% - 24px); }
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.sw { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.ln { width: 18px; border-top: 2px solid var(--ink); display: inline-block; }

aside { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding-block: 18px;
  padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); min-width: 0; }
.kicker { font: 500 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
aside h2 { font: 700 1.45rem/1.15 var(--f-display); margin: 4px 0 2px; text-wrap: balance; }
.years { font: 500 .9rem var(--f-mono); color: var(--turmeric); font-variant-numeric: tabular-nums; }
.portrait { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; object-position: top; border: 3px solid var(--fam); display: block; margin-bottom: 10px; }
.credit { font-size: .72rem; color: var(--muted); margin-top: 4px; }
.credit a { color: var(--muted); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 14px 0; font-size: .9rem; }
dt { font: 500 .72rem/1.9 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
dd { margin: 0; min-width: 0; }
.chip { display: inline-block; font: 500 .7rem var(--f-mono); padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; text-transform: uppercase; letter-spacing: .05em; }
.c-high { color: var(--fam-west); } .c-medium { color: var(--turmeric); } .c-low { color: var(--fam-siva); }
.links h3 { font: 600 .8rem var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 0 6px; }
.links ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.links button { font: inherit; text-align: left; width: 100%; border: 0; background: none; color: var(--ink); padding: 4px 6px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.links button:hover { background: color-mix(in srgb, var(--indigo) 10%, transparent); }
.links .rel { font: .72rem var(--f-mono); color: var(--muted); min-width: 5.5rem; }
.intro p { margin: 0 0 10px; color: var(--muted); max-width: 60ch; }
.intro strong { color: var(--ink); }
.warn { font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 16px; }

@media (max-width: 760px) {
  .app { height: auto; }
  main { grid-template-columns: 1fr; }
  .stage { height: 70vh; min-height: 380px; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tools { margin-left: 0; }
  .legend { font-size: .7rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Yoga Lineage <em>Atlas</em></h1>
    <div class="views" role="group" aria-label="View">
      <button id="v-web" aria-pressed="true">Web</button>
      <button id="v-tree" aria-pressed="false">Family tree</button>
      <button id="v-time" aria-pressed="false">Timeline</button>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Find a person, school, text…" aria-label="Search">
      <label><input id="t-events" type="checkbox"> History events</label>
      <label><input id="t-scholars" type="checkbox" checked> Scholars</label>
    </div>
  </header>
  <main>
    <div class="stage">
      <div id="cy" aria-label="Graph of yoga teachers, schools and events"></div>
      <div class="legend" aria-hidden="true">
        <div class="row">
          <span class="sw"><span class="dot" style="background:var(--fam-krish)"></span>Krishnamacharya</span>
          <span class="sw"><span class="dot" style="background:var(--fam-siva)"></span>Sivananda</span>
          <span class="sw"><span class="dot" style="background:var(--fam-kriya)"></span>Kriya</span>
          <span class="sw"><span class="dot" style="background:var(--fam-west)"></span>Western studio</span>
          <span class="sw"><span class="dot" style="background:var(--fam-modern)"></span>Other modern</span>
          <span class="sw"><span class="dot" style="background:var(--fam-premodern)"></span>Premodern</span>
        </div>
        <div class="row">
          <span class="sw"><span class="ln" style="border-color:var(--turmeric)"></span>teacher → student</span>
          <span class="sw"><span class="ln" style="border-top-style:dashed"></span>influence / tradition</span>
          <span class="sw"><span class="ln" style="border-color:var(--fam-siva);border-top-style:dotted"></span>family / co-author</span>
        </div>
      </div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
const DATA = /*GRAPH*/null;
const IMAGES = /*IMAGES*/{};
const CREDITS = /*CREDITS*/{};

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));

// which top-level family a lineage belongs to — drives node colour
const FAMILY_ROOTS = { L011: "krish", L017: "siva", L008: "kriya", L027: "west" };
const parentOf = Object.fromEntries(DATA.edges.filter(e => e.kind === "branch").map(e => [e.t, e.s]));
function family(lid) {
  for (let id = lid; id; id = parentOf[id]) {
    if (FAMILY_ROOTS[id]) return FAMILY_ROOTS[id];
    if (id === "L006") return "modern";
  }
  return "premodern";
}
for (const n of DATA.nodes) {
  n.fam = n.kind === "lineage" ? family(n.id)
        : n.kind === "founder" ? family(n.lineages[0])
        : n.kind === "teacher" ? "ext" : "premodern";
  n.scholar = n.kind === "founder" && n.role === "scholar";
}
// founders whose teacher is outside the dataset: colour that teacher by the student's family
for (const e of DATA.edges) if (e.kind === "teacher" && byId[e.s].kind === "teacher") byId[e.s].fam = byId[e.t].fam;

function initials(label) {
  return label.replace(/^(Swami|Sri|Shri|Paramahansa|Maharishi|Bhagawan|Mahavatar|Paramahamsa|Yogi)\s+/, "")
    .split(/\s+/).filter(w => /^[A-Z]/.test(w)).slice(0, 2).map(w => w[0]).join("");
}

const elements = [
  ...DATA.nodes.map(n => ({ data: { ...n, img: IMAGES[n.id] || "", init: initials(n.label) },
    classes: [n.kind, n.type || "", IMAGES[n.id] ? "photo" : "", n.scholar ? "scholar" : ""].join(" ") })),
  ...DATA.edges.map((e, i) => ({ data: { id: "e" + i, source: e.s, target: e.t, kind: e.kind, notes: e.notes || "" },
    classes: e.kind + (e.traditional ? " traditional" : "") })),
];

function style() {
  const famColor = f => css("--fam-" + f);
  return [
    { selector: "node", style: { "label": "data(label)", "font-family": css("--f-body"), "font-size": 11,
      "color": css("--ink"), "text-valign": "bottom", "text-margin-y": 5, "text-wrap": "wrap", "text-max-width": 110,
      "text-background-color": css("--bg"), "text-background-opacity": .75, "text-background-padding": 1, "min-zoomed-font-size": 7 } },
    { selector: "node.founder, node.teacher", style: { "shape": "ellipse", "width": 46, "height": 46,
      "background-color": ele => famColor(ele.data("fam")), "border-width": 3, "border-color": ele => famColor(ele.data("fam")),
      "label": "data(label)" } },
    { selector: "node.founder:not(.photo), node.teacher:not(.photo)", style: { "label": "data(label)",
      "background-opacity": .18 } },
    { selector: "node.photo", style: { "background-image": "data(img)", "background-fit": "cover", "background-position-y": "15%",
      "background-opacity": 1 } },
    { selector: "node.teacher", style: { "width": 36, "height": 36, "border-style": "dashed", "font-style": "italic", "color": css("--muted") } },
    { selector: "node.lineage", style: { "shape": "round-rectangle", "width": "label", "height": 22, "padding": 7,
      "background-color": css("--surface"), "border-width": 1.5, "border-color": ele => famColor(ele.data("fam")),
      "text-valign": "center", "text-margin-y": 0, "font-size": 11, "font-weight": 600, "text-background-opacity": 0, "text-max-width": 160 } },
    { selector: "node.lineage.era, node.lineage.root", style: { "font-family": css("--f-display"), "font-size": 13,
      "background-color": famColor("premodern"), "color": css("--bg"), "border-width": 0 } },
    { selector: "node.lineage.root", style: { "background-color": css("--indigo") } },
    { selector: "node.event", style: { "shape": "diamond", "width": 14, "height": 14, "background-color": css("--turmeric"),
      "font-family": css("--f-mono"), "font-size": 9, "color": css("--muted") } },
    { selector: "edge", style: { "width": 1.2, "line-color": css("--faint"), "curve-style": "bezier",
      "target-arrow-shape": "none", "arrow-scale": .8 } },
    { selector: "edge.teacher", style: { "width": 2.2, "line-color": css("--turmeric"), "target-arrow-color": css("--turmeric"), "target-arrow-shape": "triangle" } },
    { selector: "edge.traditional", style: { "line-style": "dashed" } },
    { selector: "edge.branch", style: { "target-arrow-shape": "triangle", "target-arrow-color": css("--faint"), "line-color": css("--faint") } },
    { selector: "edge.influence", style: { "line-style": "dashed", "target-arrow-shape": "triangle", "target-arrow-color": css("--muted"), "line-color": css("--muted") } },
    { selector: "edge.lineage", style: { "line-style": "dotted", "width": 1 } },
    { selector: "edge.sibling, edge.parent, edge.co-author", style: { "line-style": "dotted", "width": 2.2, "line-color": css("--fam-siva"),
      "label": "data(kind)", "font-size": 9, "color": css("--fam-siva"), "text-rotation": "autorotate",
      "text-background-color": css("--bg"), "text-background-opacity": 1 } },
    { selector: "edge.event", style: { "width": .8, "line-style": "dotted" } },
    { selector: ".faded", style: { "opacity": .12 } },
    { selector: "node:selected", style: { "border-width": 5, "border-color": css("--indigo"), "overlay-opacity": 0 } },
    { selector: "node.hit", style: { "border-width": 5, "border-color": css("--indigo") } },
  ];
}

const cy = cytoscape({ container: document.getElementById("cy"), elements, style: style(),
  wheelSensitivity: .25, minZoom: .15, maxZoom: 3 });

// ---- views ----
// timeline x: deep time squeezed, the modern era stretched (most of the people live there)
function yearX(y) {
  y = +y;
  if (y < 1800) return (y + 2600) / 4400 * 900;            // 2600 BCE..1800 → 0..900
  return 900 + (y - 1800) / 230 * 2600;                    // 1800..2030 → 900..3500
}
const LANES = { premodern: 0, kriya: 1, modern: 2, siva: 3, krish: 4, west: 5, ext: 1 };
function timelinePositions() {
  const pos = {}, used = {};
  const place = (n, x, lane) => {
    const key = lane + ":" + Math.round(x / 70);
    const k = used[key] = (used[key] || 0) + 1;
    pos[n.id] = { x: x + (k - 1) * 12, y: 180 + lane * 190 + (k - 1) * 62 };
  };
  for (const n of DATA.nodes) {
    if (n.kind === "event") { pos[n.id] = { x: yearX(n.year), y: 20 + (DATA.nodes.indexOf(n) % 3) * 40 }; continue; }
    let y = n.year || n.born;
    if (!y && n.kind === "teacher") y = 1850;
    if (!y && n.kind === "lineage") y = 1995;
    if (!y && n.kind === "founder") y = 1990;
    if (!y) y = -2600;
    const lane = n.kind === "lineage" && (n.type === "era" || n.type === "root") ? 0 : (LANES[n.fam] ?? 2);
    place(n, yearX(y), lane);
  }
  return pos;
}

let view = "web";
function layout(animate = true) {
  const vis = cy.elements(":visible");
  const anim = animate && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let opts;
  if (view === "web") opts = { name: "cose", idealEdgeLength: e => e.hasClass("teacher") ? 60 : 90, nodeRepulsion: () => 9000,
    gravity: .35, numIter: 1500, randomize: false, padding: 30 };
  else if (view === "tree") opts = { name: "breadthfirst", directed: true, roots: "#L001", spacingFactor: 1.05, padding: 30, circle: false, grid: false };
  else { const p = timelinePositions(); opts = { name: "preset", positions: n => p[n.id()], padding: 40 }; }
  vis.layout({ ...opts, animate: anim, animationDuration: 500, fit: true }).run();
}

function setView(v) {
  view = v;
  for (const b of document.querySelectorAll(".views button")) b.setAttribute("aria-pressed", b.id === "v-" + v);
  // the family tree reads best without history events cluttering the trunk
  if (v === "tree") { document.getElementById("t-events").checked = false; }
  if (v === "time") { document.getElementById("t-events").checked = true; }
  applyFilters(false);
  layout();
}
document.getElementById("v-web").onclick = () => setView("web");
document.getElementById("v-tree").onclick = () => setView("tree");
document.getElementById("v-time").onclick = () => setView("time");

function applyFilters(relayout = true) {
  const ev = document.getElementById("t-events").checked, sch = document.getElementById("t-scholars").checked;
  cy.batch(() => {
    cy.nodes(".event").style("display", ev ? "element" : "none");
    cy.nodes(".scholar").style("display", sch ? "element" : "none");
  });
  if (relayout) layout();
}
document.getElementById("t-events").onchange = () => applyFilters();
document.getElementById("t-scholars").onchange = () => applyFilters();

// ---- detail panel ----
const REL = { teacher: ["student of", "teacher of"], branch: ["branch of", "branches into"], influence: ["influenced by", "influenced"],
  lineage: ["part of", "key figure"], event: ["in event", "involves"], sibling: ["sibling", "sibling"],
  parent: ["child of", "parent of"], "co-author": ["co-author", "co-author"] };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmtYear = y => y === "" || y == null ? "" : (+y < 0 ? `${-y} BCE` : String(y));

function linksHTML(id) {
  const groups = {};
  for (const e of DATA.edges) {
    let other, rel;
    if (e.s === id) { other = e.t; rel = REL[e.kind][1]; }
    else if (e.t === id) { other = e.s; rel = REL[e.kind][0]; }
    else continue;
    (groups[rel] ||= []).push(other);
  }
  return Object.entries(groups).map(([rel, ids]) => `<h3>${esc(rel)}</h3><ul>${ids.map(o => {
    const n = byId[o]; const sub = n.kind === "event" ? n.label : (n.born ? `${n.born}–${n.died}` : fmtYear(n.year));
    return `<li><button data-go="${o}"><span class="rel">${esc(sub)}</span><span>${esc(n.kind === "event" ? n.title : n.name)}</span></button></li>`;
  }).join("")}</ul>`).join("");
}

function show(id) {
  const n = byId[id], panel = document.getElementById("panel");
  const famVar = `--fam:${css("--fam-" + n.fam)}`;
  const credit = CREDITS[id];
  let head = "", rows = [];
  if (n.kind === "founder" || n.kind === "teacher") {
    head = IMAGES[id] ? `<img class="portrait" style="${famVar}" src="${IMAGES[id]}" alt="Portrait of ${esc(n.label)}">` : "";
    head += `<div class="kicker">${esc(n.kind === "teacher" ? "teacher (outside dataset)" : n.role)}</div><h2>${esc(n.name)}</h2>`;
    if (n.born) head += `<div class="years">${esc(n.born)}–${esc(n.died || "")}</div>`;
    if (credit) head += `<div class="credit">Image: <a href="${esc(credit.page)}" target="_blank" rel="noopener">${esc(credit.artist || credit.file)}</a> · ${esc(credit.license)}</div>`;
    rows = [["region", n.region], ["known for", n.known_for], ["key works", n.works], ["notes", n.notes]];
  } else if (n.kind === "lineage") {
    head = `<div class="kicker">${esc(n.type)}</div><h2>${esc(n.name)}</h2>` + (n.year ? `<div class="years">from ${fmtYear(n.year)}</div>` : "");
    rows = [["emphasis", n.emphasis], ["notes", n.notes]];
  } else {
    head = `<div class="kicker">${esc(n.era)} · ${esc(n.category)}</div><h2>${esc(n.title)}</h2><div class="years">${esc(n.label)}</div>`;
    rows = [["event", n.name], ["texts", n.texts], ["why it matters", n.notes]];
  }
  if (n.confidence) rows.push(["confidence", `<span class="chip c-${esc(n.confidence)}">${esc(n.confidence)}</span>`]);
  panel.innerHTML = head + `<dl>${rows.filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${k === "confidence" ? v : esc(v)}</dd>`).join("")}</dl>`
    + `<div class="links">${linksHTML(id)}</div>`;
  panel.scrollTop = 0;
}

function intro() {
  document.getElementById("panel").innerHTML = `<div class="intro">
    <div class="kicker">YTT study map</div><h2>Who learned from whom</h2>
    <p><strong>Tap anyone</strong> to see their teachers, students, schools and the events they show up in. Tap empty space to reset.</p>
    <p><strong>Web</strong> clusters people by connection. <strong>Family tree</strong> runs from the root of yoga down through eras, schools and styles. <strong>Timeline</strong> lays everyone out by year, with deep time squeezed on the left so the last 150 years have room.</p>
    <p>Gold arrows run teacher → student. Dashed lines are influence, or a teaching link known only from traditional accounts.</p>
    <p class="warn">Drafted by Claude from memory, not from live sources. Check dates and attributions against the YTT manual before teaching them. Portraits are free-licensed images from Wikimedia Commons; people without one show their family colour.</p>
  </div>`;
}

function focus(id) {
  const node = cy.getElementById(id);
  const hood = node.closedNeighborhood();
  cy.batch(() => { cy.elements().addClass("faded"); hood.removeClass("faded"); });
  cy.nodes().unselect(); node.select();
  cy.animate({ fit: { eles: hood.filter(":visible"), padding: 60 } }, { duration: 400 });
  show(id);
}
function reset() { cy.elements().removeClass("faded hit"); cy.nodes().unselect(); intro(); }

cy.on("tap", "node", e => focus(e.target.id()));
cy.on("tap", e => { if (e.target === cy) reset(); });
document.getElementById("panel").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  const id = b.dataset.go;
  if (cy.getElementById(id).style("display") === "none") {
    if (byId[id].kind === "event") document.getElementById("t-events").checked = true;
    else document.getElementById("t-scholars").checked = true;
    applyFilters(false);
  }
  focus(id);
});

document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  cy.elements().removeClass("hit faded");
  if (!q) return;
  const hits = cy.nodes(":visible").filter(n => [n.data("name"), n.data("label"), n.data("title"), n.data("known_for")].join(" ").toLowerCase().includes(q));
  if (!hits.length) return;
  cy.elements().addClass("faded"); hits.removeClass("faded").addClass("hit");
  if (hits.length === 1) focus(hits[0].id()); else cy.animate({ fit: { eles: hits, padding: 80 } }, { duration: 300 });
});

// restyle when the theme flips
const mq = matchMedia("(prefers-color-scheme: dark)");
const restyle = () => cy.style(style());
mq.addEventListener?.("change", restyle);
new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

intro();
applyFilters(false);
layout(false);
</script>
