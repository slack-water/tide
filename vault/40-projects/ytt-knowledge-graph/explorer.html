<style>
/* layout: graph fills the frame, a narrow detail column on the right (below on narrow embeds) */
:root {
  --bg: #ffffff; --surface: #f7f6f3; --ink: #1f2430; --muted: #6b7180; --line: #e3e2de;
  --accent: #2f3f7a; --gold: #c98a12;
  --fam-krish: #c98a12; --fam-siva: #c2553a; --fam-kriya: #6d4fa3; --fam-west: #2f8a7a;
  --fam-modern: #2f3f7a; --fam-premodern: #7a6a50; --fam-ext: #8b919a;
  --f-body: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #191919; --surface: #202020; --ink: #e6e6e3; --muted: #9b9b97; --line: #2f2f2f;
  --accent: #9fb0ef; --gold: #e7ad3c;
  --fam-krish: #e7ad3c; --fam-siva: #e47b62; --fam-kriya: #ab92e0; --fam-west: #5cc2b0;
  --fam-modern: #8ea2ee; --fam-premodern: #b9a684; color-scheme: dark } }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f-body); display: grid; grid-template-rows: auto 1fr; }
header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.crumbs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; min-width: 0; }
.crumbs button { font: inherit; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.crumbs button:hover { background: var(--surface); }
.crumbs .here { color: var(--ink); font-weight: 600; cursor: default; }
.crumbs .sep { color: var(--muted); }
.hint { margin-left: auto; color: var(--muted); font-size: 12px; }
main { display: grid; grid-template-columns: 1fr 230px; min-height: 0; }
#cy { min-height: 0; }
aside { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 12px; min-width: 0; }
.kicker { font: 500 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
aside h2 { font-size: 16px; line-height: 1.25; margin: 3px 0 2px; }
.years { font: 12px var(--f-mono); color: var(--gold); }
.portrait { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid var(--fam); display: block; margin-bottom: 8px; }
.field { margin-top: 8px; }
.field b { display: block; font: 500 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.actions { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.actions a, .actions button { font: inherit; text-align: center; text-decoration: none; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.actions .primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.warn { margin-top: 12px; font-size: 11px; color: var(--muted); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
@media (max-width: 560px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; }
  .hint { display: none; }
}
</style>
</head>

s a six-limbed (ṣaḍaṅga) yoga","era":"Upanishadic","category":"text","year":"-300","end":"100","texts":"Maitrī Upaniṣad (6.18)","notes":"Precursor to Patañjali's eight limbs","confidence":"low"},{"id":"T009","kind":"event","label":"c. 6th–4th c. BCE","title":"Śramaṇa movements: the Buddha and Mahāvīra","name":"Śramaṇa movements: the Buddha and Mahāvīra teach meditation (dhyāna) and ascetic discipline outside Vedic orthodoxy","era":"Sramana","category":"movement","year":"-600","end":"-400","texts":"Pāli Canon; Jain Āgamas","notes":"Parallel meditation systems; mutual influence with Patañjali is debated","confidence":"medium"},{"id":"T010","kind":"event","label":"c. 200 BCE–200 CE","title":"Mahābhārata and the Bhagavad Gītā","name":"Mahābhārata includes the Bhagavad Gītā (karma- jñāna- and bhakti-yoga; yoga as equanimity) and Sāṃkhya-Yoga material in the Mokṣadharma","era":"Epic","category":"text","year":"-200","end":"200","texts":"Mahābhārata; Bhagavad Gītā","notes":"Yoga becomes a broad path concept beyond meditation (Gītā 2.48 samatvaṃ yoga ucyate)","confidence":"medium"},{"id":"T011","kind":"event","label":"c. 2nd c. BCE–4th c. CE (debated)","title":"Patañjali's Yoga Sūtras compiled","name":"Patañjali's Yoga Sūtras compiled (~195 sūtras in four pādas); eight-limbed (aṣṭāṅga) path; Sāṃkhya metaphysics","era":"Classical","category":"text","year":"-200","end":"400","texts":"Yoga Sūtras","notes":"Foundational classical yoga text; teaches a steady seat for meditation rather than a posture repertoire (YS 2.46)","confidence":"low"},{"id":"T012","kind":"event","label":"c. 4th–5th c. CE","title":"Sāṃkhyakārikā: 25 tattvas and three guṇas","name":"Īśvarakṛṣṇa's Sāṃkhyakārikā systematizes the 25 tattvas and the three guṇas","era":"Classical","category":"text","year":"350","end":"450","texts":"Sāṃkhyakārikā","notes":"Standard source for the puruṣa-prakṛti-guṇa framework","confidence":"medium"},{"id":"T013","kind":"event","label":"c. 5th c. CE","title":"Vyāsa's Yoga Bhāṣya","name":"Vyāsa's Yoga Bhāṣya becomes the standard commentary on the Yoga Sūtras","era":"Classical","category":"text","year":"400","end":"500","texts":"Yogabhāṣya (Pātañjalayogaśāstra)","notes":"Earliest extant commentary; Sūtras and Bhāṣya may have circulated as one work","confidence":"medium"},{"id":"T014","kind":"event","label":"c. 10th c. CE","title":"Vācaspati Miśra's Tattvavaiśāradī","name":"Vācaspati Miśra writes the Tattvavaiśāradī sub-commentary on the Yoga Bhāṣya","era":"Classical","category":"text","year":"900","end":"1000","texts":"Tattvavaiśāradī","notes":"Major interpretive layer for later Yoga-Sāṃkhya scholarship","confidence":"medium"},{"id":"T015","kind":"event","label":"c. 6th–10th c. CE","title":"Tantric traditions: mantra, cakras, kuṇḍalinī","name":"Tantric traditions elaborate mantra; mudrā; cakras; nāḍīs and kuṇḍalinī; Kashmir Śaivism develops","era":"Tantric","category":"movement","year":"500","end":"1000","texts":"Śaiva and Śākta Tantras","notes":"Subtle-body models later absorbed into haṭha yoga","confidence":"medium"},{"id":"T016","kind":"event","label":"c. 11th–13th c. CE","title":"Nāth Siddhas develop haṭha techniques","name":"Nāth Siddha ascetics develop haṭha yoga techniques (bandhas; mudrās; breath retention) aimed at stabilizing bindu and breath; very few āsanas taught","era":"Early Hatha","category":"movement","year":"1000","end":"1300","texts":"Amṛtasiddhi; Dattātreyayogaśāstra; Gorakṣaśataka","notes":"Origin of haṭha practice; posture is a minor limb","confidence":"medium"},{"id":"T017","kind":"event","label":"c. 15th c. CE","title":"Haṭha Yoga Pradīpikā compiled","name":"Svātmārāma compiles the Haṭha Yoga Pradīpikā; teaches 15 āsanas plus ṣaṭkarma; prāṇāyāma; mudrā; samādhi","era":"Hatha","category":"text","year":"1400","end":"1500","texts":"Haṭha Yoga Pradīpikā","notes":"Most influential premodern haṭha manual","confidence":"medium"},{"id":"T018","kind":"event","label":"c. 17th–18th c. CE","title":"Later haṭha compendia expand postur d6a","T027":"3fa6ebb18b31817c8bccfec0cf56105e","T028":"3fa6ebb18b318123ad95f6341d18666b","T029":"3fa6ebb18b3181c19a06cc1540e62a50","T030":"3fa6ebb18b318197890ac290df362c2d","T031":"3fa6ebb18b31810a8f3ad0f8b2e15bdf","T032":"3fa6ebb18b3181ec9c74efec9c4b2c47","T033":"3fa6ebb18b318191b0d5e8abb3bd7e80","T034":"3fa6ebb18b3181388fc5d3bc6342c735","T035":"3fa6ebb18b318149a871c396028f253c","T036":"3fa6ebb18b3181338fe6f94857e70891","T037":"3fa6ebb18b3181cabdb3f4abdfb7fe64","T038":"3fa6ebb18b31814bbcc2dbbeec8d66e7","T039":"3fa6ebb18b3181c2a4c5ff1a2b212c90","T040":"3fa6ebb18b318134b3c5def0948f64d6"};

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// colour each node by the top-level family it descends from
const ROOTS = { L011: "krish", L017: "siva", L008: "kriya", L027: "west" };
const parentOf = Object.fromEntries(DATA.edges.filter(e => e.kind === "branch").map(e => [e.t, e.s]));
function family(lid) {
  for (let id = lid; id; id = parentOf[id]) { if (ROOTS[id]) return ROOTS[id]; if (id === "L006") return "modern"; }
  return "premodern";
}
for (const n of DATA.nodes) n.fam = n.kind === "lineage" ? family(n.id) : n.kind === "founder" ? family(n.lineages[0]) : n.kind === "teacher" ? "ext" : "premodern";

const VERB = { teacher: ["taught", "student of"], branch: ["branch", "branch of"], influence: ["influenced", "influenced by"],
  lineage: ["school", "member"], event: ["involved", "in event"], sibling: ["sibling", "sibling"], parent: ["parent of", "child of"], "co-author": ["co-author", "co-author"] };

function label(n) {
  if (n.kind === "event") return n.title;
  if (n.kind === "founder" && n.born) return `${n.label}\n${n.born}–${n.died || ""}`;
  return n.label;
}

function elementsFor(ids, focus) {
  const set = new Set(ids);
  const nodes = ids.map(id => {
    const n = byId[id];
    return { data: { id, label: label(n), img: IMAGES[id] || "", fam: n.fam },
      classes: [n.kind, IMAGES[id] ? "photo" : "", id === focus ? "focus" : ""].join(" ") };
  });
  const edges = DATA.edges.filter(e => set.has(e.s) && set.has(e.t)).map((e, i) => ({
    data: { id: "e" + i, source: e.s, target: e.t, verb: VERB[e.kind][0] },
    classes: e.kind + (e.traditional ? " traditional" : "") }));
  return [...nodes, ...edges];
}

function style() {
  const fam = f => css("--fam-" + f);
  return [
    { selector: "node", style: { label: "data(label)", "font-size": 10, "font-family": css("--f-body"), color: css("--ink"),
      "text-wrap": "wrap", "text-max-width": 120, "text-valign": "bottom", "text-margin-y": 4,
      "text-background-color": css("--bg"), "text-background-opacity": .8, "text-background-padding": 1 } },
    { selector: "node.founder, node.teacher", style: { shape: "ellipse", width: 40, height: 40,
      "background-color": e => fam(e.data("fam")), "background-opacity": .2, "border-width": 3, "border-color": e => fam(e.data("fam")) } },
    { selector: "node.photo", style: { "background-image": "data(img)", "background-fit": "cover", "background-opacity": 1 } },
    { selector: "node.teacher", style: { width: 32, height: 32, "border-style": "dashed", color: css("--muted") } },
    { selector: "node.lineage", style: { shape: "round-rectangle", width: "label", height: 20, padding: 6, "text-valign": "center", "text-margin-y": 0,
      "background-color": css("--surface"), "border-width": 1.5, "border-color": e => fam(e.data("fam")), "font-weight": 600, "text-background-opacity": 0 } },
    { selector: "node.event", style: { shape: "diamond", width: 16, height: 16, "background-color": css("--gold"), color: css("--muted"), "font-size": 9 } },
    { selector: "node.focus", style: { "border-width": 5, "border-color": css("--accent"), "font-weight": 700, "font-size": 11 } },
    { selector: "node.lineage.focus", style: { "border-width": 3 } },
    { selector: "edge", style: { width: 1.3, "line-color": css("--line"), "curve-style": "bezier", label: "data(verb)",
      "font-size": 8.5, color: css("--muted"), "text-rotation": "autorotate", "text-background-color": css("--bg"),
      "text-background-opacity": 1, "text-background-padding": 1, "target-arrow-shape": "triangle", "target-arrow-color": css("--line"), "arrow-scale": .7 } },
    { selector: "edge.teacher", style: { width: 2.2, "line-color": css("--gold"), "target-arrow-color": css("--gold") } },
    { selector: "edge.traditional, edge.influence", style: { "line-style": "dashed" } },
    { selector: "edge.sibling, edge.co-author, edge.parent", style: { "line-style": "dotted", width: 2, "line-color": css("--fam-siva"), "target-arrow-shape": "none" } },
    { selector: "node:active, node:selected", style: { "overlay-opacity": 0 } },
  ];
}

const cy = cytoscape({ container: document.getElementById("cy"), style: style(), minZoom: .3, maxZoom: 2.5, wheelSensitivity: .3 });
let trail = [];   // breadcrumb of focus ids; empty = my map

function render() {
  const focus = trail[trail.length - 1];
  let ids, layout;
  if (!focus) {
    ids = SELECTED.filter(id => byId[id]);
    layout = { name: "cose", animate: false, randomize: true, nodeDimensionsIncludeLabels: true, numIter: 2500,
      nodeRepulsion: () => 400000, idealEdgeLength: () => 110, edgeElasticity: () => 80, gravity: 40, padding: 24 };
  } else {
    const nb = DATA.edges.flatMap(e => e.s === focus ? [e.t] : e.t === focus ? [e.s] : []);
    ids = [...new Set([focus, ...nb])];
    layout = { name: "concentric", animate: false, padding: 24, minNodeSpacing: 40, nodeDimensionsIncludeLabels: true,
      concentric: n => n.id() === focus ? 2 : 1, levelWidth: () => 1 };
  }
  cy.elements().remove();
  cy.add(elementsFor(ids, focus));
  cy.layout(layout).run();
  cy.fit(undefined, 24);
  crumbs();
  focus ? show(focus) : intro(ids.length);
}

function crumbs() {
  const el = document.getElementById("crumbs");
  const parts = [`<button data-i="-1" class="${trail.length ? "" : "here"}">My map</button>`];
  trail.forEach((id, i) => parts.push(`<span class="sep">›</span><button data-i="${i}" class="${i === trail.length - 1 ? "here" : ""}">${esc(byId[id].kind === "event" ? byId[id].title : byId[id].label)}</button>`));
  el.innerHTML = parts.join("");
}
document.getElementById("crumbs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.classList.contains("here")) return;
  trail = trail.slice(0, +b.dataset.i + 1); render();
});

function intro(count) {
  document.getElementById("panel").innerHTML = `<div class="kicker">My map</div><h2>${count} selected</h2>
    <p>Rows with <b>On map</b> ticked in Notion. Click any node to open its local graph, then keep clicking to walk the lineage. The path at the top takes you back.</p>
    <p class="warn">AI-drafted dataset. Verify against the YTT manual before teaching.</p>`;
}

function show(id) {
  const n = byId[id];
  const rows = n.kind === "founder" ? [["role", n.role], ["known for", n.known_for], ["key works", n.works], ["notes", n.notes]]
    : n.kind === "lineage" ? [["emphasis", n.emphasis], ["notes", n.notes]]
    : n.kind === "event" ? [["what happened", n.name], ["why it matters", n.notes]]
    : [["note", n.notes]];
  const sub = n.kind === "founder" && n.born ? `${n.born}–${n.died || ""}` : n.kind === "event" ? n.label : n.year ? `from ${n.year}` : "";
  const page = PAGES[id];
  document.getElementById("panel").innerHTML =
    (IMAGES[id] ? `<img class="portrait" style="--fam:${css("--fam-" + n.fam)}" src="${IMAGES[id]}" alt="">` : "") +
    `<div class="kicker">${esc(n.kind === "teacher" ? "teacher outside the dataset" : n.kind === "lineage" ? n.type : n.kind === "event" ? n.era : n.role)}</div>
     <h2>${esc(n.kind === "event" ? n.title : n.name)}</h2>${sub ? `<div class="years">${esc(sub)}</div>` : ""}` +
    rows.filter(r => r[1]).map(([k, v]) => `<div class="field"><b>${k}</b>${esc(v)}</div>`).join("") +
    `<div class="actions">${page ? `<a class="primary" href="https://www.notion.so/${page}" target="_blank" rel="noopener">Open in Notion</a>` : ""}</div>`;
}

cy.on("tap", "node", e => {
  const id = e.target.id();
  if (id === trail[trail.length - 1]) return;
  const at = trail.indexOf(id);
  trail = at >= 0 ? trail.slice(0, at + 1) : [...trail, id];
  render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { cy.style(style()); });
render();
</script>
